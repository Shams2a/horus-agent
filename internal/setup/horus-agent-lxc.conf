# Conteneur LXC uniquement (écrit par « horus-agent setup » et « --repair »).
#
# LXCFS montre au conteneur ses propres ressources : /proc/meminfo, /proc/stat,
# /proc/loadavg, /proc/uptime… Ces deux protections remontent /proc et /sys
# dans l'espace de l'agent et font perdre ces montages : l'agent mesurerait
# alors l'hôte (mémoire, processeur, charge). Sans droit d'écriture ni
# capacité, l'agent ne peut de toute façon modifier ni /proc/sys ni les
# cgroups.
[Service]
ProtectKernelTunables=no
ProtectControlGroups=no
